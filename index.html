<body class="bg-background text-on-background min-h-full flex flex-col font-body-md text-body-md antialiased selection:bg-primary-fixed selection:text-on-primary-fixed">
<!-- Top Minimal Utility Bar with Co-op Identity & Station Status -->

<!-- Main Portal Split / Centered Layout -->
<main class="flex-1 flex items-center justify-center p-4 sm:p-6 lg:p-8">
<div class="w-full max-w-md">
<!-- Login Card Surface -->
<div class="flex flex-col items-center justify-center mb-6 text-center"><div class="w-10 h-10 rounded-lg bg-primary flex items-center justify-center text-on-primary mb-2 shadow-xs"><span class="material-symbols-outlined text-xl" data-icon="agriculture">agriculture</span></div><div class="flex flex-col items-center"><span class="font-headline-sm text-headline-sm font-bold text-primary tracking-tight">AgriShare</span><span class="font-label-sm text-label-sm text-on-surface-variant">Valley Basin Co-op System</span></div></div><div class="bg-surface-container-lowest border border-outline-variant/80 rounded-xl shadow-sm p-6 sm:p-8">
<!-- Header & Title -->
<div class="text-center mb-6">
<h1 class="font-headline-md text-headline-md font-bold text-primary mb-1">
            Member Access Portal
          </h1>
<p class="font-body-sm text-body-sm text-on-surface-variant">
            Sign in to reserve equipment, log field hours, or view station dispatch.
          </p>
</div>
<!-- Role Toggle Pill Switcher -->
<div class="mb-6">
<label class="block font-label-md text-label-md text-on-surface-variant mb-2">
            Select Your Account Type
          </label>
<div class="grid grid-cols-2 p-1 bg-surface-container-low rounded-lg border border-outline-variant/60" id="roleToggleGroup" role="tablist">
<button class="flex items-center justify-center gap-2 py-2 px-3 rounded-lg text-body-sm font-semibold transition-all duration-150 bg-primary-container text-on-primary shadow-xs" id="roleMemberBtn" onclick="selectRole('member'); const h=document.getElementById('identifierHelper'); if(h) h.classList.add('hidden'); document.getElementById('identifierLabel').textContent='Email Address / Username'; document.getElementById('identifierInput').placeholder='Enter email address or username'; document.getElementById('securityKeyLabel').textContent='Password'; document.getElementById('securityKeyInput').placeholder='Enter password';" type="button">
<span class="material-symbols-outlined text-base" data-icon="person">person</span>
<span class="">Farmer / Member</span>
</button>
<button class="flex items-center justify-center gap-2 py-2 px-3 rounded-lg text-body-sm font-medium transition-all duration-150 text-on-surface-variant hover:text-on-surface" id="roleStaffBtn" onclick="selectRole('staff')" type="button">
<span class="material-symbols-outlined text-base" data-icon="badge">badge</span>
<span class="">Office Staff</span>
</button>
</div>
</div>
<!-- Credentials Form -->
<form class="space-y-5" onsubmit="event.preventDefault();">
<!-- Input 1: Identifier -->
<div>
<div class="flex justify-between items-center mb-1.5"><label class="font-label-md text-label-md text-on-surface font-medium" for="identifierInput" id="identifierLabel">Email Address / Username</label></div>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-on-surface-variant">
<span class="material-symbols-outlined text-lg" data-icon="account_circle" id="identifierIcon">account_circle</span>
</div>
<input class="w-full pl-10 pr-3.5 py-2.5 bg-surface-container-lowest border border-outline-variant rounded-lg text-on-surface font-body-md text-body-md placeholder:text-outline focus:outline-none focus:border-primary-container focus:ring-2 focus:ring-primary-container/20 transition-all duration-150" id="identifierInput" name="identifier" placeholder="Enter email address or username" required="" type="text">
</div>
</div>
<!-- Input 2: 4-digit PIN / Password -->
<div>
<div class="flex justify-between items-center mb-1.5"><label class="font-label-md text-label-md text-on-surface font-medium" for="securityKeyInput" id="securityKeyLabel">4-Digit Member PIN</label><a class="font-label-sm text-label-sm text-primary hover:underline font-medium" href="#">Forgot Password?</a></div>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-on-surface-variant">
<span class="material-symbols-outlined text-lg" data-icon="lock">lock</span>
</div>
<input class="w-full pl-10 pr-10 py-2.5 bg-surface-container-lowest border border-outline-variant rounded-lg text-on-surface font-body-md text-body-md placeholder:text-outline focus:outline-none focus:border-primary-container focus:ring-2 focus:ring-primary-container/20 transition-all duration-150" id="securityKeyInput" name="password" placeholder="••••" required="" type="password" maxlength="6">
<button aria-label="Toggle password visibility" class="absolute inset-y-0 right-0 pr-3 flex items-center text-on-surface-variant hover:text-on-surface" onclick="togglePinVisibility()" type="button">
<span class="material-symbols-outlined text-lg" data-icon="visibility" id="eyeIcon">visibility</span>
</button>
</div>
</div>
<!-- Quick Station Remember Option -->
<div class="flex items-center justify-between pt-1">
<label class="flex items-center gap-2 cursor-pointer">
<input checked="" class="w-4 h-4 rounded text-primary-container border-outline-variant focus:ring-primary-container" type="checkbox">
<span class="font-body-sm text-body-sm text-on-surface-variant">Remember me&nbsp;</span>
</label>
</div>
<!-- Primary Sign In Action -->
<div class="pt-2">
<button class="w-full min-h-[46px] py-3 px-4 rounded-lg bg-primary-container text-on-primary font-headline-sm text-headline-sm font-semibold hover:bg-primary transition-all duration-150 shadow-xs flex items-center justify-center gap-2 active:scale-[0.99]" type="submit">
<span class="">Sign In</span>
<span class="material-symbols-outlined text-xl" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
</form>
<!-- Divider with cooperative note -->
<div class="relative my-6">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-outline-variant/60"></div>
</div>
<div class="relative flex justify-center text-label-sm font-label-sm">
<span class="bg-surface-container-lowest px-3 text-on-surface-variant">
              COOPERATIVE REGISTRATION
            </span>
</div>
</div>
<!-- Prominent Registration Callout -->
<div class="text-center p-3.5 rounded-lg bg-surface-container-low border border-outline-variant/60">
<p class="font-body-sm text-body-sm text-on-surface mb-1">
            New farming member or joining the co-op pool?
          </p>
<a class="inline-flex items-center gap-1 font-body-sm text-body-sm font-semibold text-secondary hover:underline" href="#">
<span class="">New member? Register here</span>
<span class="material-symbols-outlined text-base" data-icon="open_in_new">open_in_new</span>
</a>
</div>
</div>
<!-- Quick Rural Telephone Assistance Banner -->

<!-- Footer Metadata / Station Info -->

</div>
</main>
<script>
    let currentRole = 'member';

    function selectRole(role) {
      currentRole = role;
      const memberBtn = document.getElementById('roleMemberBtn');
      const staffBtn = document.getElementById('roleStaffBtn');
      const identifierLabel = document.getElementById('identifierLabel');
      const identifierInput = document.getElementById('identifierInput');
      const securityKeyLabel = document.getElementById('securityKeyLabel');
      const securityKeyInput = document.getElementById('securityKeyInput');
      const identifierIcon = document.getElementById('identifierIcon');

      if (role === 'member') {
        // Style Member Button as active
        memberBtn.className = "flex items-center justify-center gap-2 py-2 px-3 rounded-lg text-body-sm font-semibold transition-all duration-150 bg-primary-container text-on-primary shadow-xs";
        staffBtn.className = "flex items-center justify-center gap-2 py-2 px-3 rounded-lg text-body-sm font-medium transition-all duration-150 text-on-surface-variant hover:text-on-surface";
        
        // Update input fields for farmers
        identifierLabel.textContent = "Member ID, Phone, or Email";
        identifierInput.placeholder = "04-9821 or (555) 234-5678";
        identifierIcon.textContent = "account_circle";
        securityKeyLabel.textContent = "4-Digit Member PIN";
        securityKeyInput.placeholder = "••••";
        securityKeyInput.maxLength = 6;
      } else {
        // Style Staff Button as active
        staffBtn.className = "flex items-center justify-center gap-2 py-2 px-3 rounded-lg text-body-sm font-semibold transition-all duration-150 bg-primary-container text-on-primary shadow-xs";
        memberBtn.className = "flex items-center justify-center gap-2 py-2 px-3 rounded-lg text-body-sm font-medium transition-all duration-150 text-on-surface-variant hover:text-on-surface";
        
        // Update input fields for staff
        identifierLabel.textContent = "Staff Operator Email or Username";
        identifierInput.placeholder = "dispatcher@agrishare.coop";
        identifierIcon.textContent = "badge";
        securityKeyLabel.textContent = "Staff Password";
        securityKeyInput.placeholder = "Enter station password";
        securityKeyInput.removeAttribute('maxLength');
      }
    }

    function togglePinVisibility() {
      const pinInput = document.getElementById('securityKeyInput');
      const eyeIcon = document.getElementById('eyeIcon');
      if (pinInput.type === 'password') {
        pinInput.type = 'text';
        eyeIcon.textContent = 'visibility_off';
      } else {
        pinInput.type = 'password';
        eyeIcon.textContent = 'visibility';
      }
    }
  </script>








</body></html>
